<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Умный дом — ЛР3 — мониторинг</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</head>
<body>
  <h1>Мониторинг (лабораторная работа №3)</h1>
  <p>Данные обновляются раз в секунду отдельным AJAX-запросом для каждой вещи.</p>
  <section>
    <h2>Температура</h2>
    <input type="text" id="temperature_value" readonly placeholder="°C">
  </section>
  <section>
    <h2>Освещение</h2>
    <input type="text" id="light_state" readonly placeholder="состояние">
    <input type="text" id="light_brightness" readonly placeholder="яркость %">
  </section>
  <section>
    <h2>Замок</h2>
    <input type="text" id="lock_state" readonly placeholder="закрыт / открыт">
  </section>
</body>
</html>
